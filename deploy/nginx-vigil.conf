# Vigil: deploy/setup.sh sostituisce vigil.example.com e i percorsi del certificato.
server {
    listen 80;
    listen [::]:80;
    server_name vigil.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vigil.example.com;

    ssl_certificate     /etc/letsencrypt/live/vigil.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vigil.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    # Le planimetrie arrivano già ridotte sotto 1 MB
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        # Il controllo sulle azioni confronta Host e origine: non toglierli
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        # Il limite dei tentativi di accesso si basa su X-Real-IP
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}
